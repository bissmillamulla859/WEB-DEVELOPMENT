<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //loop;once the loop is started you should know how to stop the loop
        //condition true loop starts condition false loop stops
        //print number 1 to 10
        //console.log(1)
        //console.log(2)
        //console.log(3)
        //for(starting point; ending condition; -- or ++ )
        //print no 1 to 10 
        for(let i=1; i<=10; i++){
            console.log("The value is",i)
        }
        //print no 10 to 1
        for(let j=10;j>=1;j--){
            console.log("The value is",j)
        }

        //while loop-entry controlled loop
        //while(condition):condition is true while loop start and condition false while loop stop
        let count=1

        while(count<=5){
            console.log("Hello,I am while loop")
            count++
        }

        //do-while loop-exit controlled loop
        //it will execute the code at least one time if condition is false
        let number=7
        do{
            console.log("Hi i am do-while loop")
        }while(number<5)
    </script>
</body>
</html>
