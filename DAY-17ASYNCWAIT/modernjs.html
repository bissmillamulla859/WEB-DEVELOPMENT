<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //template string-var orr parameter allow with text
        var a = "john"
        //old way
        console.log("my name is",a)
        //new way $(var name/parameter)
        console.log("my name is ${a}")

        //arrow function-function logic in one line
        //pld way function
        function xyz(){
            console.log("hello")
        }
        //new way
        var abc= ()->{
            console.log("hello i am function")
        }
        abc()
    </script>
</body>
</html>
